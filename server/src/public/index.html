<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#102542" id="theme-color-meta" />
  <title>بازمو | نسخه وب شبکه صنف موبایل ایران</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('bazmo_theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', dark ? '#0B192E' : '#102542');
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css?v=4" />
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>در حال اتصال به سرور بازمو...</p>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="/app.js?v=4"></script>
</body>
</html>
